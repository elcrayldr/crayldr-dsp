name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-vst3:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (VS 2022, x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build Release
        run: cmake --build build --config Release --parallel
      - name: Core tests (Release)
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload VST3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CRAY_LDR_VOX_LEVELER_VST3_x64
          path: build/CrayLdrVoxLeveler_artefacts/Release/VST3/
          if-no-files-found: warn
      - name: pluginval (strictness 5)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pv.zip
          Expand-Archive pv.zip -DestinationPath pv
          ./pv/pluginval.exe --strictness-level 5 --validate-in-process --output-dir pluginval-logs "build/CrayLdrVoxLeveler_artefacts/Release/VST3/CRAY LDR VOX LEVELER.vst3"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pluginval-logs
          path: pluginval-logs

  core-sanitizers-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCRAYLDR_BUILD_PLUGIN=OFF -DCRAYLDR_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
